<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">原神 · 脸部明暗由两个阈值相遇产生</title><desc id="desc">纹理规定局部边界；光方向控制边界推进到哪里</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1050" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">原神 · 脸部明暗由两个阈值相遇产生</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">纹理规定局部边界；光方向控制边界推进到哪里</text><rect x="30" y="110" width="450" height="150" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="140" fill="#2166a8" font-size="23" text-anchor="start">脸部位置 → SDF 纹理</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">读取红色 r 和 alpha a</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">a &gt; 0.0001：s = (a + 1) / 2</text><text x="50" y="217" fill="#24364d" font-size="20" text-anchor="start">否则：s = r / 2</text><rect x="520" y="110" width="450" height="150" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="540" y="140" fill="#7055a1" font-size="23" text-anchor="start">世界光方向 → 脸部局部方向</text><text x="540" y="167" fill="#24364d" font-size="20" text-anchor="start">投影到局部轴并归一化</text><text x="540" y="192" fill="#24364d" font-size="20" text-anchor="start">q = clamp(0.5 − 0.5l + δ)</text><text x="540" y="217" fill="#24364d" font-size="20" text-anchor="start">本帧限制范围：0.03 ～ 0.97</text><path d="M255 260 L255 300 L500 300 L500 338" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745 260 L745 300 L500 300" fill="none" stroke="#61748c" stroke-width="2.5"/><rect x="30" y="340" width="940" height="122" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="50" y="370" fill="#b86518" font-size="23" text-anchor="start">比较：d = (s − q) × k</text><text x="50" y="397" fill="#24364d" font-size="20" text-anchor="start">s &lt; q：转向暗侧；s = q：过渡中心；s &gt; q：转向亮侧</text><text x="50" y="422" fill="#24364d" font-size="20" text-anchor="start">当前 k = 100；这是阈值域陡度，不是屏幕像素宽度</text><path d="M500,462 L500,498" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="500" width="940" height="122" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="530" fill="#287e59" font-size="23" text-anchor="start">S 形转换 → 明暗权重</text><text x="50" y="557" fill="#24364d" font-size="20" text-anchor="start">纹理过滤与表面梯度也会改变屏幕中的边界形状</text><text x="50" y="582" fill="#24364d" font-size="20" text-anchor="start">当前主分支由材质控制为不翻转横向 UV</text><path d="M500,622 L500,658" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="660" width="940" height="66" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="690" fill="#287e59" font-size="23" text-anchor="start">再与底色、阴影色、高光和局部控制组合</text><path d="M75 755 L75 930 L500 930" fill="none" stroke="#61748c" stroke-width="1.5"/><path d="M75.0 929.1 L78.4 929.0 L81.8 928.9 L85.2 928.8 L88.6 928.7 L92.0 928.6 L95.4 928.5 L98.8 928.4 L102.2 928.2 L105.6 928.1 L109.0 927.9 L112.4 927.7 L115.8 927.5 L119.2 927.3 L122.6 927.0 L126.0 926.8 L129.4 926.5 L132.8 926.2 L136.2 925.9 L139.6 925.5 L143.0 925.1 L146.4 924.7 L149.8 924.2 L153.2 923.7 L156.6 923.2 L160.0 922.6 L163.4 921.9 L166.8 921.2 L170.2 920.5 L173.6 919.7 L177.0 918.8 L180.4 917.9 L183.8 916.9 L187.2 915.8 L190.6 914.7 L194.0 913.4 L197.4 912.1 L200.8 910.7 L204.2 909.2 L207.6 907.6 L211.0 905.8 L214.4 904.0 L217.8 902.1 L221.2 900.0 L224.6 897.9 L228.0 895.6 L231.4 893.2 L234.8 890.7 L238.2 888.1 L241.6 885.4 L245.0 882.5 L248.4 879.6 L251.8 876.6 L255.2 873.5 L258.6 870.3 L262.0 867.0 L265.4 863.7 L268.8 860.3 L272.2 856.9 L275.6 853.5 L279.0 850.0 L282.4 846.5 L285.8 843.1 L289.2 839.7 L292.6 836.3 L296.0 833.0 L299.4 829.7 L302.8 826.5 L306.2 823.4 L309.6 820.4 L313.0 817.5 L316.4 814.6 L319.8 811.9 L323.2 809.3 L326.6 806.8 L330.0 804.4 L333.4 802.1 L336.8 800.0 L340.2 797.9 L343.6 796.0 L347.0 794.2 L350.4 792.4 L353.8 790.8 L357.2 789.3 L360.6 787.9 L364.0 786.6 L367.4 785.3 L370.8 784.2 L374.2 783.1 L377.6 782.1 L381.0 781.2 L384.4 780.3 L387.8 779.5 L391.2 778.8 L394.6 778.1 L398.0 777.4 L401.4 776.8 L404.8 776.3 L408.2 775.8 L411.6 775.3 L415.0 774.9 L418.4 774.5 L421.8 774.1 L425.2 773.8 L428.6 773.5 L432.0 773.2 L435.4 773.0 L438.8 772.7 L442.2 772.5 L445.6 772.3 L449.0 772.1 L452.4 771.9 L455.8 771.8 L459.2 771.6 L462.6 771.5 L466.0 771.4 L469.4 771.3 L472.8 771.2 L476.2 771.1 L479.6 771.0 L483.0 770.9 " fill="none" stroke="#2166a8" stroke-width="3"/><text x="83" y="758" fill="#24364d" font-size="18" text-anchor="start">亮侧权重</text><text x="165" y="975" fill="#24364d" font-size="18" text-anchor="start">阈值差 s − q</text><text x="550" y="817" fill="#24364d" font-size="23" text-anchor="start">同一个纹理位置 s 固定</text><text x="550" y="855" fill="#24364d" font-size="23" text-anchor="start">光方向改变 → q 移动</text><text x="550" y="893" fill="#24364d" font-size="23" text-anchor="start">边界沿脸部阈值分布移动</text><text x="550" y="950" fill="#24364d" font-size="18" text-anchor="start">曲线为公式绘图，不是截帧像素测量。</text><text x="30" y="1030" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
