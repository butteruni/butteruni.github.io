<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="title desc"><title id="title">原神 · 两种环境反馈共用布局，分别更新</title><desc id="desc">角色先读已有结果；后面的采样与汇总产生供之后使用的新结果</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1090" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">原神 · 两种环境反馈共用布局，分别更新</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">角色先读已有结果；后面的采样与汇总产生供之后使用的新结果</text><text x="35" y="126" fill="#24364d" font-size="20" text-anchor="start">颜色：10 列</text><text x="360" y="126" fill="#24364d" font-size="20" text-anchor="start">阴影：60 列</text><rect x="35" y="145" width="130" height="165" fill="#edf5ff" stroke="#2166a8"/><rect x="165" y="145" width="780" height="165" fill="#fff4e4" stroke="#b86518"/><path d="M48 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M61 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M74 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M87 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M100 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M113 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M126 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M139 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M152 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M165 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M178 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M191 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M204 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M217 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M230 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M243 145 V310" stroke=