th=".6"/><path d="M685 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M698 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M711 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M724 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M737 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M750 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M763 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M776 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M789 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M802 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M815 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M828 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M841 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M854 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M867 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M880 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M893 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M906 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M919 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M932 145 V310" stroke="#9caabe" stroke-width=".6"/><path d="M35 178 H945" stroke="#9caabe" stroke-width=".7"/><path d="M35 211 H945" stroke="#9caabe" stroke-width=".7"/><path d="M35 244 H945" stroke="#9caabe" stroke-width=".7"/><path d="M35 277 H945" stroke="#9caabe" stroke-width=".7"/><text x="35" y="345" fill="#24364d" font-size="21" text-anchor="start">70 × 5：每列五个空间样本。颜色去主视图；阴影去光源覆盖层。</text><rect x="30" y="395" width="450" height="150" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="425" fill="#2166a8" font-size="23" text-anchor="start">颜色侧：有效样本均值</text><text x="50" y="452" fill="#24364d" font-size="20" text-anchor="start">排除无效位置与特定材质类别</text><text x="50" y="477" fill="#24364d" font-size="20" text-anchor="start">新值 = 0.9 × 旧值 + 0.1 × 均值</text><text x="50" y="502" fill="#24364d" font-size="20" text-anchor="start">无有效样本时保留旧颜色</text><rect x="520" y="395" width="450" height="150" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="540" y="425" fill="#b86518" font-size="23" text-anchor="start">阴影侧：遮挡驱动状态变化</text><text x="540" y="452" fill="#24364d" font-size="20" text-anchor="start">样本保存 1 − 阴影通过率</text><text x="540" y="477" fill="#24364d" font-size="20" text-anchor="start">主结果 a + 有记忆的偏差 b</text><text x="540" y="502" fill="#24364d" font-size="20" text-anchor="start">非线性更新；特殊控制可强制覆盖</text><path d="M255,545 L255,580" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745,545 L745,580" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="585" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="615" fill="#287e59" font-size="23" text-anchor="start">70 × 1：分别保存新颜色与新阴影状态</text><text x="50" y="642" fill="#24364d" font-size="20" text-anchor="start">颜色和阴影保持原有分区，数值含义不互换</text><text x="50" y="667" fill="#24364d" font-size="20" text-anchor="start">槽位是任务布局，不能把 70 列解释成 70 个角色</text><rect x="30" y="735" width="450" height="122" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="50" y="765" fill="#7055a1" font-size="23" text-anchor="start">本次角色材质</text><text x="50" y="792" fill="#24364d" font-size="20" text-anchor="start">读取已有反馈</text><text x="50" y="817" fill="#24364d" font-size="20" text-anchor="start">身体、脸部、裙装、眼睛选择性使用</text><rect x="520" y="735" width="450" height="122" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="540" y="765" fill="#2166a8" font-size="23" text-anchor="start">本次后续取样与汇总</text><text x="540" y="792" fill="#24364d" font-size="20" text-anchor="start">使用场景材质颜色和阴影</text><text x="540" y="817" fill="#24364d" font-size="20" text-anchor="start">更新上面的两类反馈</text><path d="M480,796 L514,796" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745 735 L745 698" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 679 L500 920 L255 920 L255 865" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="530" y="923" fill="#24364d" font-size="20" text-anchor="start">跨次使用的依赖</text><path d="M500 679 L500 920 L255 920 L255 865" fill="none" stroke="#fff" stroke-width="4"/><path d="M500 679 L500 920 L255 920 L255 865" fill="none" stroke="#61748c" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="30" y="1015" fill="#24364d" font-size="18" text-anchor="start">本图表示读写先后，不把单帧可见的关系扩大成已验证的更新频率或槽位交换策略。</text><text x="30" y="1070" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
