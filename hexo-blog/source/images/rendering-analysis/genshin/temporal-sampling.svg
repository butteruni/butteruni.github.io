<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc"><title id="title">原神 · 当前颜色与历史颜色采用不同重建</title><desc id="desc">运动寻找旧位置；类别和保留状态决定旧颜色能怎样使用</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1120" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">原神 · 当前颜色与历史颜色采用不同重建</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">运动寻找旧位置；类别和保留状态决定旧颜色能怎样使用</text><text x="30" y="122" fill="#24364d" font-size="23" text-anchor="start">当前：4 × 4 个颜色样本</text><text x="530" y="122" fill="#24364d" font-size="23" text-anchor="start">历史：5 次过滤采样</text><circle cx="110" cy="165" r="8" fill="#2166a8"/><circle cx="175" cy="165" r="8" fill="#2166a8"/><circle cx="240" cy="165" r="8" fill="#2166a8"/><circle cx="305" cy="165" r="8" fill="#2166a8"/><circle cx="110" cy="220" r="8" fill="#2166a8"/><circle cx="175" cy="220" r="8" fill="#2166a8"/><circle cx="240" cy="220" r="8" fill="#2166a8"/><circle cx="305" cy="220" r="8" fill="#2166a8"/><circle cx="110" cy="275" r="8" fill="#2166a8"/><circle cx="175" cy="275" r="8" fill="#2166a8"/><circle cx="240" cy="275" r="8" fill="#2166a8"/><circle cx="305" cy="275" r="8" fill="#2166a8"/><circle cx="110" cy="330" r="8" fill="#2166a8"/><circle cx="175" cy="330" r="8" fill="#2166a8"/><circle cx="240" cy="330" r="8" fill="#2166a8"/><circle cx="305" cy="330" r="8" fill="#2166a8"/><g stroke="#9caabe" stroke-width="2"><path d="M655 250 H905"/><path d="M780 150 V350"/></g><g fill="#7055a1"><circle cx="780" cy="250" r="9"/><circle cx="655" cy="250" r="9"/><circle cx="905" cy="250" r="9"/><circle cx="780" cy="150" r="9"/><circle cx="780" cy="350" r="9"/></g><text x="90" y="388" fill="#24364d" font-size="19" text-anchor="start">中心随采样偏移移动</text><text x="594" y="388" fill="#24364d" font-size="19" text-anchor="start">中央坐标随旧坐标的小数部分移动</text><rect x="30" y="435" width="450" height="150" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="465" fill="#2166a8" font-size="23" text-anchor="start">当前重建</text><text x="50" y="492" fill="#24364d" font-size="20" text-anchor="start">十六点径向核，包含负权重区间</text><text x="50" y="517" fill="#24364d" font-size="20" text-anchor="start">加权后按总权重归一化</text><text x="50" y="542" fill="#24364d" font-size="20" text-anchor="start">夹到这十六点的颜色范围</text><rect x="520" y="435" width="450" height="150" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="540" y="465" fill="#7055a1" font-size="23" text-anchor="start">历史 RGB 重建</text><text x="540" y="492" fill="#24364d" font-size="20" text-anchor="start">中心 + 横纵外侧修正</text><text x="540" y="517" fill="#24364d" font-size="20" text-anchor="start">外侧系数 0.45 × (f² − f)</text><text x="540" y="542" fill="#24364d" font-size="20" text-anchor="start">归一化，保持恒定颜色</text><path d="M255,585 L255,618" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745,585 L745,618" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="620" width="940" height="94" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="50" y="650" fill="#b86518" font-size="23" text-anchor="start">依据材质类别与历史状态限制旧颜色</text><text x="50" y="677" fill="#24364d" font-size="20" text-anchor="start">高位类别来自当前像素；运动可以来自邻域前景</text><text x="50" y="702" fill="#24364d" font-size="20" text-anchor="start">历史状态和 alpha 控制量另行读取，不套用 RGB 的负瓣核</text><path d="M500,714 L500,748" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="750" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="780" fill="#287e59" font-size="23" text-anchor="start">由当前权重和与受限的历史累积量决定混合</text><text x="50" y="807" fill="#24364d" font-size="20" text-anchor="start">当前比例 = W / (W + 12H)</text><text x="50" y="832" fill="#24364d" font-size="20" text-anchor="start">运动影响累积上限，覆盖控制还会进一步改变允许的历史</text><path d="M500 844 L500 880 L255 880 L255 915" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 880 L745 880 L745 915" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="920" width="450" height="122" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="950" fill="#287e59" font-size="23" text-anchor="start">状态结果</text><text x="50" y="977" fill="#24364d" font-size="20" text-anchor="start">颜色约束的保留状态</text><text x="50" y="1002" fill="#24364d" font-size="20" text-anchor="start">归一化的历史累积量</text><rect x="520" y="920" width="450" height="122" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="540" y="950" fill="#287e59" font-size="23" text-anchor="start">颜色结果</text><text x="540" y="977" fill="#24364d" font-size="20" text-anchor="start">RGB：混合颜色</text><text x="540" y="1002" fill="#24364d" font-size="20" text-anchor="start">alpha：当前附加控制标记</text><text x="30" y="1100" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
