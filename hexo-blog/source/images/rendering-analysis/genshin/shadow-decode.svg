<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="title desc"><title id="title">原神 · 从压缩记录恢复阴影深度</title><desc id="desc">块元数据负责定位，树负责选择局部区域，载荷负责恢复数值</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1030" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">原神 · 从压缩记录恢复阴影深度</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">块元数据负责定位，树负责选择局部区域，载荷负责恢复数值</text><rect x="30" y="110" width="940" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="140" fill="#2166a8" font-size="23" text-anchor="start">输出像素坐标</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">整数坐标 ÷ 32 → 块元数据；块内坐标的位 → 查询象限</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">横纵各取一位：q = bx + 2by</text><path d="M500,204 L500,238" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="240" width="940" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="270" fill="#2166a8" font-size="23" text-anchor="start">四叉树查找：32 → 16 → 8 → 4 → 2 像素</text><text x="50" y="297" fill="#24364d" font-size="20" text-anchor="start">最多四次实际象限寻址；遇到叶子可以提前结束</text><text x="50" y="322" fill="#24364d" font-size="20" text-anchor="start">每个节点 10 位，三个节点共用一个 32 位整数</text><path d="M500,334 L500,368" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="370" width="940" height="94" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="50" y="400" fill="#7055a1" font-size="23" text-anchor="start">读取叶子对应的 32 位深度载荷</text><text x="50" y="427" fill="#24364d" font-size="20" text-anchor="start">最低模式位决定两条恢复路径</text><text x="50" y="452" fill="#24364d" font-size="20" text-anchor="start">剩余坐标低位供 2 × 2 像素选择</text><path d="M500 464 L500 490 L265 490 L265 518" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 490 L735 490 L735 518" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="520" width="450" height="150" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="550" fill="#2166a8" font-size="23" text-anchor="start">平面模式</text><text x="50" y="577" fill="#24364d" font-size="20" text-anchor="start">两个 10 位字段 → 斜率</text><text x="50" y="602" fill="#24364d" font-size="20" text-anchor="start">一个 11 位字段 → 基准量</text><text x="50" y="627" fill="#24364d" font-size="20" text-anchor="start">按块原点校正，再在像素中心求值</text><rect x="520" y="520" width="450" height="150" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="540" y="550" fill="#b86518" font-size="23" text-anchor="start">2 × 2 模式</text><text x="540" y="577" fill="#24364d" font-size="20" text-anchor="start">最低坐标位选择四个样本</text><text x="540" y="602" fill="#24364d" font-size="20" text-anchor="start">字段分别为 6、7、6、7 位</text><text x="540" y="627" fill="#24364d" font-size="20" text-anchor="start">与共享尺度组合，恢复深度</text><text x="60" y="713" fill="#24364d" font-size="19" text-anchor="start">z = 基准 + 斜率 · 块内归一化位置</text><text x="545" y="713" fill="#24364d" font-size="18" text-anchor="start">右列码值多一位，解码尺度也相应调整</text><path d="M50 670 L50 752 L500 752 L500 788" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M950 670 L950 752 L500 752" fill="none" stroke="#61748c" stroke-width="2.5"/><rect x="30" y="790" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="820" fill="#287e59" font-size="23" text-anchor="start">深度输出 → 后续阴影比较与屏幕解析</text><text x="50" y="847" fill="#24364d" font-size="20" text-anchor="start">恢复的是光源视角的深度，不是最终阴影亮度</text><text x="50" y="872" fill="#24364d" font-size="20" text-anchor="start">动态角色阴影另需几何处理，不能由这份静态载荷代替</text><text x="30" y="960" fill="#24364d" font-size="20" text-anchor="start">“查到哪块数据”和“解出多深”是两个步骤；两者都正确，比较采样才有意义。</text><text x="30" y="1010" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
