<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title desc"><title id="title">绝区零 · 一个屏幕分区怎样生成灯光列表</title><desc id="desc">先建立屏幕候选，再让 64 个线程分别处理 64 个深度层</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1080" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">绝区零 · 一个屏幕分区怎样生成灯光列表</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">先建立屏幕候选，再让 64 个线程分别处理 64 个深度层</text><rect x="30" y="110" width="610" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="140" fill="#2166a8" font-size="23" text-anchor="start">屏幕包围范围检查</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">64 个线程按步幅遍历输入光源</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">通过者用组内原子加申请槽位</text><rect x="700" y="110" width="270" height="94" rx="12" fill="#f0f3f7" stroke="#526479" stroke-width="1.7"/><text x="720" y="140" fill="#526479" font-size="23" text-anchor="start">空间粒度</text><text x="720" y="167" fill="#24364d" font-size="20" text-anchor="start">一个分区：64 × 64 像素</text><text x="720" y="192" fill="#24364d" font-size="20" text-anchor="start">本帧：54 × 23 个分区</text><path d="M335,204 L335,238" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="240" width="610" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="270" fill="#2166a8" font-size="23" text-anchor="start">组内同步 → 按光源索引排序</text><text x="50" y="297" fill="#24364d" font-size="20" text-anchor="start">候选最多 128 项；补齐到二的幂</text><text x="50" y="322" fill="#24364d" font-size="20" text-anchor="start">空槽作为最大无符号值排到末端</text><path d="M335,334 L335,368" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="370" width="610" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="400" fill="#2166a8" font-size="23" text-anchor="start">把光源深度范围映射为起止层</text><text x="50" y="427" fill="#24364d" font-size="20" text-anchor="start">两个 8 位字段保存一个光源的层范围</text><text x="50" y="452" fill="#24364d" font-size="20" text-anchor="start">每层统计可能命中数，预留全局索引空间</text><rect x="700" y="370" width="270" height="94" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="720" y="400" fill="#b86518" font-size="23" text-anchor="start">线程职责发生变化</text><text x="720" y="427" fill="#24364d" font-size="20" text-anchor="start">前段：每线程检查光源</text><text x="720" y="452" fill="#24364d" font-size="20" text-anchor="start">后段：每线程负责一层</text><path d="M335,464 L335,498" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="500" width="610" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="530" fill="#2166a8" font-size="23" text-anchor="start">六平面保守剔除</text><text x="50" y="557" fill="#24364d" font-size="20" text-anchor="start">光源体积的平面 × 深度格子的八个角点</text><text x="50" y="582" fill="#24364d" font-size="20" text-anchor="start">存在一个平面将八角全排除 → 跳过</text><rect x="700" y="500" width="270" height="94" rx="12" fill="#f0f3f7" stroke="#526479" stroke-width="1.7"/><text x="720" y="530" fill="#526479" font-size="23" text-anchor="start">通过不等于处处受光</text><text x="720" y="557" fill="#24364d" font-size="20" text-anchor="start">保留可能相关的候选</text><text x="720" y="582" fill="#24364d" font-size="20" text-anchor="start">逐像素仍计算衰减</text><path d="M335,594 L335,628" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="630" width="610" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="660" fill="#287e59" font-size="23" text-anchor="start">按类型写实际索引</text><text x="50" y="687" fill="#24364d" font-size="20" text-anchor="start">写入：光源索引 − 该类型的数据基址</text><text x="50" y="712" fill="#24364d" font-size="20" text-anchor="start">实际计数可以少于预留容量</text><path d="M335,724 L335,758" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="760" width="610" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="790" fill="#287e59" font-size="23" text-anchor="start">输出两类列表头</text><text x="50" y="817" fill="#24364d" font-size="20" text-anchor="start">各类分别记录起点与数量</text><text x="50" y="842" fill="#24364d" font-size="20" text-anchor="start">数量上限为 31，与 128 项候选上限不同</text><rect x="700" y="760" width="270" height="94" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="720" y="790" fill="#7055a1" font-size="23" text-anchor="start">消费端</text><text x="720" y="817" fill="#24364d" font-size="20" text-anchor="start">先取列表，再恢复类型基址</text><text x="720" y="842" fill="#24364d" font-size="20" text-anchor="start">只遍历表头声明的范围</text><path d="M640,807 L694,807" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="900" width="260" height="65" fill="#fff4e4" stroke="#b86518"/><rect x="290" y="900" width="680" height="65" fill="#edf5ff" stroke="#2166a8"/><text x="52" y="940" fill="#24364d" font-size="22" text-anchor="start">高 5 位：数量 0～31</text><text x="320" y="940" fill="#24364d" font-size="22" text-anchor="start">低 27 位：索引池起点</text><text x="30" y="1015" fill="#24364d" font-size="20" text-anchor="start">读索引示例：起点 100，数量 3 → 读取 indexPool[100…102]（假设值）</text><text x="30" y="1060" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
