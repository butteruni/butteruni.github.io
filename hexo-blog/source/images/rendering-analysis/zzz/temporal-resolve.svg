<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc"><title id="title">绝区零 · 历史颜色怎样被接受或拒绝</title><desc id="desc">身份判定、颜色约束、覆盖回退是三个独立条件</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1060" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">绝区零 · 历史颜色怎样被接受或拒绝</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">身份判定、颜色约束、覆盖回退是三个独立条件</text><rect x="30" y="110" width="600" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="140" fill="#2166a8" font-size="23" text-anchor="start">当前深度 → 近处表面 → 运动与身份</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">中心与四个对角候选中择近</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">解码运动后，计算旧帧中的对应坐标</text><rect x="690" y="110" width="280" height="94" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="710" y="140" fill="#7055a1" font-size="23" text-anchor="start">独立历史</text><text x="710" y="167" fill="#24364d" font-size="20" text-anchor="start">历史颜色 + 历史身份</text><text x="710" y="192" fill="#24364d" font-size="20" text-anchor="start">两种数据分别保存</text><path d="M330,204 L330,238" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="240" width="600" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="270" fill="#2166a8" font-size="23" text-anchor="start">点采样历史身份并比较</text><text x="50" y="297" fill="#24364d" font-size="20" text-anchor="start">身份差绝对值大于 0.1？</text><text x="50" y="322" fill="#24364d" font-size="20" text-anchor="start">先判断表面对应是否允许复用</text><rect x="690" y="240" width="280" height="94" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="710" y="270" fill="#b86518" font-size="23" text-anchor="start">不匹配 → 提前返回</text><text x="710" y="297" fill="#24364d" font-size="20" text-anchor="start">直接输出当前颜色</text><text x="710" y="322" fill="#24364d" font-size="20" text-anchor="start">同时写入当前身份</text><path d="M630,287 L684,287" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330,334 L330,368" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="358" fill="#24364d" font-size="18" text-anchor="start">匹配</text><rect x="30" y="370" width="600" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="400" fill="#2166a8" font-size="23" text-anchor="start">当前颜色中心 + 四个对角样本</text><text x="50" y="427" fill="#24364d" font-size="20" text-anchor="start">构造锐化结果 S 和亮度参考 Q</text><text x="50" y="452" fill="#24364d" font-size="20" text-anchor="start">使用最大通道将 HDR 压入计算域</text><rect x="690" y="370" width="280" height="94" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="710" y="400" fill="#7055a1" font-size="23" text-anchor="start">过滤采样历史颜色</text><text x="710" y="427" fill="#24364d" font-size="20" text-anchor="start">在同一对应坐标采样</text><text x="710" y="452" fill="#24364d" font-size="20" text-anchor="start">然后压入相同颜色域</text><path d="M330,464 L330,498" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="500" width="600" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="530" fill="#2166a8" font-size="23" text-anchor="start">由当前邻域建立颜色范围</text><text x="50" y="557" fill="#24364d" font-size="20" text-anchor="start">两个对角样本的 min / max</text><text x="50" y="582" fill="#24364d" font-size="20" text-anchor="start">亮度差 × 运动相关倍率扩张范围</text><path d="M330,594 L330,628" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="630" width="600" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="660" fill="#2166a8" font-size="23" text-anchor="start">沿区间中心方向裁剪历史</text><text x="50" y="687" fill="#24364d" font-size="20" text-anchor="start">三个通道共用一个回退比例 t</text><text x="50" y="712" fill="#24364d" font-size="20" text-anchor="start">限制旧颜色超出当前允许范围的程度</text><path d="M830 464 L830 677 L638 677" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330,724 L330,758" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="760" width="600" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="790" fill="#287e59" font-size="23" text-anchor="start">按运动融合 → 恢复 HDR</text><text x="50" y="817" fill="#24364d" font-size="20" text-anchor="start">基础历史权重：0.95 ～ 0.70</text><text x="50" y="842" fill="#24364d" font-size="20" text-anchor="start">再按覆盖标记偏向当前样本</text><rect x="690" y="760" width="280" height="94" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="710" y="790" fill="#b86518" font-size="23" text-anchor="start">覆盖与边界标记</text><text x="710" y="817" fill="#24364d" font-size="20" text-anchor="start">影响采样偏移</text><text x="710" y="842" fill="#24364d" font-size="20" text-anchor="start">也可以要求回退当前</text><path d="M690,807 L636,807" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330,854 L330,888" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="890" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="920" fill="#287e59" font-size="23" text-anchor="start">配对输出：新颜色 + 当前身份</text><text x="50" y="947" fill="#24364d" font-size="20" text-anchor="start">新颜色继续进入后处理；两份对应结果为后续历史读取提供依据</text><text x="50" y="972" fill="#24364d" font-size="20" text-anchor="start">本阶段没有独立的历史深度测试，也没有 3 × 3 YCoCg 方差统计</text><text x="30" y="1040" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
