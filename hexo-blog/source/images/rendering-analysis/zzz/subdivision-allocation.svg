<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc"><title id="title">绝区零 · 边拆分与索引空间分配</title><desc id="desc">新点先由边处理写好，索引生成阶段再建立三角形连接</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="880" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">绝区零 · 边拆分与索引空间分配</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">新点先由边处理写好，索引生成阶段再建立三角形连接</text><text x="38" y="133" fill="#24364d" font-size="22" text-anchor="start">不拆边：1 个三角形</text><text x="365" y="133" fill="#24364d" font-size="22" text-anchor="start">拆 1 边：2 个三角形</text><text x="698" y="133" fill="#24364d" font-size="22" text-anchor="start">拆 3 边：4 个三角形</text><g stroke="#2166a8" stroke-width="3" fill="#edf5ff"><path d="M55 325 L160 170 L265 325 Z"/><path d="M380 325 L485 170 L590 325 Z"/><path d="M705 325 L810 170 L915 325 Z"/></g><g stroke="#b86518" stroke-width="3" fill="none"><path d="M485 325 L485 170"/><path d="M757.5 247.5 L862.5 247.5 L810 325 Z"/></g><g fill="#b86518"><circle cx="485" cy="325" r="6"/><circle cx="757.5" cy="247.5" r="6"/><circle cx="862.5" cy="247.5" r="6"/><circle cx="810" cy="325" r="6"/></g><text x="58" y="365" fill="#24364d" font-size="20" text-anchor="start">追加 0 个索引</text><text x="380" y="365" fill="#24364d" font-size="20" text-anchor="start">追加 3 个索引</text><text x="705" y="365" fill="#24364d" font-size="20" text-anchor="start">追加 9 个索引</text><rect x="30" y="410" width="430" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="440" fill="#2166a8" font-size="23" text-anchor="start">组内原子计数</text><text x="50" y="467" fill="#24364d" font-size="20" text-anchor="start">每个任务申请 3 × 拆边数个槽位</text><text x="50" y="492" fill="#24364d" font-size="20" text-anchor="start">返回本任务在组内的偏移</text><rect x="550" y="410" width="420" height="94" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="570" y="440" fill="#b86518" font-size="23" text-anchor="start">一个线程申请全局空间</text><text x="570" y="467" fill="#24364d" font-size="20" text-anchor="start">全组同步后读取组内总数</text><text x="570" y="492" fill="#24364d" font-size="20" text-anchor="start">返回整组追加区间的起点</text><path d="M460,457 L544,457" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760,504 L760,552" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="555" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="585" fill="#287e59" font-size="23" text-anchor="start">最终地址 = 整组起点 + 本任务组内偏移</text><text x="50" y="612" fill="#24364d" font-size="20" text-anchor="start">原有三个索引槽存第一个三角形，其余写入追加区间</text><text x="50" y="637" fill="#24364d" font-size="20" text-anchor="start">组内原子到达顺序可以变化；正确性要求区间互不重叠</text><text x="30" y="705" fill="#24364d" font-size="21" text-anchor="start">假设四个任务申请 0、3、9、6 个追加索引，共申请 18 个槽位：</text><rect x="30" y="735" width="155" height="60" fill="#edf5ff" stroke="#2166a8"/><rect x="185" y="735" width="470" height="60" fill="#eaf7f0" stroke="#287e59"/><rect x="655" y="735" width="315" height="60" fill="#fff4e4" stroke="#b86518"/><text x="55" y="773" fill="#24364d" font-size="20" text-anchor="start">任务 B：3</text><text x="305" y="773" fill="#24364d" font-size="20" text-anchor="start">任务 C：9</text><text x="755" y="773" fill="#24364d" font-size="20" text-anchor="start">任务 D：6</text><text x="30" y="832" fill="#24364d" font-size="18" text-anchor="start">任务 A 追加量为零；上图是一种可能的分配顺序，不规定线程完成顺序。</text><text x="30" y="860" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
