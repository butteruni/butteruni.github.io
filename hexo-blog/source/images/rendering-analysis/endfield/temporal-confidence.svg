<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="title desc"><title id="title">终末地 · 颜色历史、表面验证与状态反馈</title><desc id="desc">先验证对应关系，再限制历史颜色；输出 alpha 保存后续会使用的状态</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1180" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">终末地 · 颜色历史、表面验证与状态反馈</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">先验证对应关系，再限制历史颜色；输出 alpha 保存后续会使用的状态</text><rect x="30" y="110" width="940" height="122" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="50" y="140" fill="#b86518" font-size="23" text-anchor="start">表面验证 → 低分辨率变化汇总</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">当前与历史深度、运动、分类共同判断表面对应</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">生成预处理数据与 860 × 360 标记，再交给颜色融合</text><path d="M500 232 L500 266 L255 266 L255 298" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 266 L745 266 L745 298" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="300" width="450" height="178" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="330" fill="#2166a8" font-size="23" text-anchor="start">当前颜色的 3 × 3 邻域</text><text x="50" y="357" fill="#24364d" font-size="20" text-anchor="start">RGB → YCoCg</text><text x="50" y="382" fill="#24364d" font-size="20" text-anchor="start">计算均值 μ 与标准差 σ</text><text x="50" y="407" fill="#24364d" font-size="20" text-anchor="start">范围：μ ± γσ</text><text x="50" y="432" fill="#24364d" font-size="20" text-anchor="start">扩展到至少包含当前中心</text><rect x="520" y="300" width="450" height="178" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="540" y="330" fill="#7055a1" font-size="23" text-anchor="start">重投影后的历史 RGB</text><text x="540" y="357" fill="#24364d" font-size="20" text-anchor="start">五次过滤采样</text><text x="540" y="382" fill="#24364d" font-size="20" text-anchor="start">每次先压缩亮度，再加权恢复</text><text x="540" y="407" fill="#24364d" font-size="20" text-anchor="start">额外普通样本 Hb 约束过冲</text><text x="540" y="432" fill="#24364d" font-size="20" text-anchor="start">限制到 0.2Hb ～ 1.8Hb</text><path d="M255 478 L255 512 L500 512 L500 547" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745 478 L745 512 L500 512" fill="none" stroke="#61748c" stroke-width="2.5"/><rect x="30" y="550" width="940" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="580" fill="#2166a8" font-size="23" text-anchor="start">普通分支：把历史 YCoCg 夹到当前允许范围</text><text x="50" y="607" fill="#24364d" font-size="20" text-anchor="start">邻域标准差逐分量控制 γ，阈值与当前颜色编码尺度绑定</text><text x="50" y="632" fill="#24364d" font-size="20" text-anchor="start">空间颜色约束和表面有效性判定分别发挥作用</text><path d="M500,644 L500,678" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="680" width="940" height="122" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="50" y="710" fill="#b86518" font-size="23" text-anchor="start">反馈状态：q新 = max(q局部, 0.9 × q旧) × G</text><text x="50" y="737" fill="#24364d" font-size="20" text-anchor="start">局部亮度结构、旧 alpha 与当前拒绝条件共同决定</text><text x="50" y="762" fill="#24364d" font-size="20" text-anchor="start">强状态且历史位置有效时，可以放宽普通夹取并调整权重</text><path d="M500,802 L500,838" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="840" width="940" height="122" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="870" fill="#287e59" font-size="23" text-anchor="start">在按亮度归一化的 YCoCg 中融合</text><text x="50" y="897" fill="#24364d" font-size="20" text-anchor="start">混合比例受运动、类别、位置、拒绝与状态分支影响</text><text x="50" y="922" fill="#24364d" font-size="20" text-anchor="start">恢复 HDR，再从 YCoCg 转回 RGB</text><path d="M500,962 L500,998" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="1000" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="1030" fill="#287e59" font-size="23" text-anchor="start">输出 RGB + 新状态 alpha → 后续泛光</text><text x="50" y="1057" fill="#24364d" font-size="20" text-anchor="start">颜色与状态保持对应；反射读取旧 HDR 的依赖也必须先完成</text><text x="30" y="1160" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
