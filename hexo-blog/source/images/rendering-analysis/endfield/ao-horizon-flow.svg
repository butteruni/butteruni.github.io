<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc"><title id="title">终末地 · 从深度地平线到稳定遮蔽</title><desc id="desc">方向搜索、历史拒绝和空间保边分别限制不同来源的误差</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1110" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">终末地 · 从深度地平线到稳定遮蔽</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">方向搜索、历史拒绝和空间保边分别限制不同来源的误差</text><circle cx="280" cy="278" r="12" fill="#24364d"/><path d="M130 278 L430 278" stroke="#9caabe" stroke-width="2"/><circle cx="235" cy="278" r="7" fill="#b86518"/><circle cx="185" cy="278" r="7" fill="#b86518"/><circle cx="135" cy="278" r="7" fill="#b86518"/><circle cx="325" cy="278" r="7" fill="#2166a8"/><circle cx="375" cy="278" r="7" fill="#2166a8"/><circle cx="425" cy="278" r="7" fill="#2166a8"/><path d="M205 148.0961894323342 L355 407.9038105676658" stroke="#9caabe" stroke-width="2"/><circle cx="257.5" cy="239.02885682970026" r="7" fill="#b86518"/><circle cx="232.5" cy="195.72758664047834" r="7" fill="#b86518"/><circle cx="207.5" cy="152.4263164512564" r="7" fill="#b86518"/><circle cx="302.5" cy="316.97114317029974" r="7" fill="#2166a8"/><circle cx="327.5" cy="360.2724133595217" r="7" fill="#2166a8"/><circle cx="352.5" cy="403.5736835487436" r="7" fill="#2166a8"/><path d="M355 148.0961894323342 L205.00000000000003 407.9038105676658" stroke="#9caabe" stroke-width="2"/><circle cx="302.5" cy="239.02885682970026" r="7" fill="#b86518"/><circle cx="327.5" cy="195.7275866404783" r="7" fill="#b86518"/><circle cx="352.5" cy="152.42631645125638" r="7" fill="#b86518"/><circle cx="257.5" cy="316.97114317029974" r="7" fill="#2166a8"/><circle cx="232.50000000000003" cy="360.2724133595217" r="7" fill="#2166a8"/><circle cx="207.50000000000003" cy="403.5736835487436" r="7" fill="#2166a8"/><rect x="535" y="130" width="435" height="178" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="555" y="160" fill="#2166a8" font-size="23" text-anchor="start">三条方向线 × 三个步长 × 两侧</text><text x="555" y="187" fill="#24364d" font-size="20" text-anchor="start">共 18 个核心深度查询</text><text x="555" y="212" fill="#24364d" font-size="20" text-anchor="start">方向含扰动，距离经过幂分布</text><text x="555" y="237" fill="#24364d" font-size="20" text-anchor="start">像素半径上限为 48</text><text x="555" y="262" fill="#24364d" font-size="20" text-anchor="start">较远查询选择较粗深度 mip</text><text x="65" y="459" fill="#24364d" font-size="18" text-anchor="start">蓝 / 橙：同一方向的正、负两侧</text><rect x="535" y="335" width="435" height="122" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="555" y="365" fill="#7055a1" font-size="23" text-anchor="start">恢复观察空间位置</text><text x="555" y="392" fill="#24364d" font-size="20" text-anchor="start">把法线投影到方向切片</text><text x="555" y="417" fill="#24364d" font-size="20" text-anchor="start">记录两侧地平线并积分</text><path d="M280 422 L475 422 L475 480 L500 480 L500 513" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M750 457 L750 480 L500 480" fill="none" stroke="#61748c" stroke-width="2.5"/><rect x="30" y="515" width="450" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="545" fill="#2166a8" font-size="23" text-anchor="start">半分辨率原始遮蔽</text><text x="50" y="572" fill="#24364d" font-size="20" text-anchor="start">保存每像素的遮蔽响应</text><text x="50" y="597" fill="#24364d" font-size="20" text-anchor="start">不是最终场景照明</text><rect x="520" y="515" width="450" height="94" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="540" y="545" fill="#b86518" font-size="23" text-anchor="start">独立 R8 边界</text><text x="540" y="572" fill="#24364d" font-size="20" text-anchor="start">四方向连续程度各占 2 位</text><text x="540" y="597" fill="#24364d" font-size="20" text-anchor="start">决定过滤可否跨过邻接边</text><path d="M255,609 L255,648" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="650" width="450" height="122" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="50" y="680" fill="#7055a1" font-size="23" text-anchor="start">AO 历史</text><text x="50" y="707" fill="#24364d" font-size="20" text-anchor="start">运动重投影 + 深度差衰减</text><text x="50" y="732" fill="#24364d" font-size="20" text-anchor="start">旧遮蔽夹到当前 3 × 3 范围</text><rect x="520" y="650" width="450" height="122" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="540" y="680" fill="#b86518" font-size="23" text-anchor="start">双向连接权重</text><text x="540" y="707" fill="#24364d" font-size="20" text-anchor="start">中心向右许可 × 邻居向左许可</text><text x="540" y="732" fill="#24364d" font-size="20" text-anchor="start">一侧不允许，连接就被抑制</text><path d="M745,609 L745,648" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M255 772 L255 806 L500 806 L500 843" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745 772 L745 806 L500 806" fill="none" stroke="#61748c" stroke-width="2.5"/><rect x="30" y="845" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="875" fill="#287e59" font-size="23" text-anchor="start">两轮保边过滤 → 五点上采样 → 全分辨率遮蔽</text><text x="50" y="902" fill="#24364d" font-size="20" text-anchor="start">过滤结果按总权重归一化，避免邻居减少就自动变暗</text><text x="50" y="927" fill="#24364d" font-size="20" text-anchor="start">最后上采样不再读取深度；主要几何限制已在前面完成</text><text x="30" y="1020" fill="#24364d" font-size="20" text-anchor="start">AO 历史与整帧 HDR 历史分别维护；边界图也不是历史置信度。</text><text x="30" y="1090" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
