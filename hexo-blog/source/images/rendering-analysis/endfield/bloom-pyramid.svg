<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="title desc"><title id="title">终末地 · 泛光的下降、保留与逐层重建</title><desc id="desc">下降结果在上升阶段继续使用；粗层扩大光晕，细层补回本层亮部</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1090" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">终末地 · 泛光的下降、保留与逐层重建</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">下降结果在上升阶段继续使用；粗层扩大光晕，细层补回本层亮部</text><rect x="30" y="110" width="940" height="94" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="50" y="140" fill="#b86518" font-size="23" text-anchor="start">HDR → 软阈值提取 → 极亮样本降权预过滤</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">保留连续的亮部响应，同时限制孤立极亮值支配邻域</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">半分辨率亮部作为层级起点</text><path d="M260,204 L260,245" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="250" width="440" height="66" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="280" fill="#2166a8" font-size="23" text-anchor="start">1720 × 720：保留细层亮部</text><rect x="530" y="250" width="440" height="66" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="550" y="280" fill="#287e59" font-size="23" text-anchor="start">最终上升结果</text><path d="M250,316 L250,350" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M750,350 L750,322" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="355" width="380" height="66" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="110" y="385" fill="#2166a8" font-size="23" text-anchor="start">860 × 360：保留本层</text><rect x="530" y="355" width="380" height="66" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="550" y="385" fill="#287e59" font-size="23" text-anchor="start">粗层重建 + 本层混合</text><path d="M470,387 L524,387" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280,421 L280,455" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720,455 L720,427" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="150" y="460" width="320" height="66" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="170" y="490" fill="#2166a8" font-size="23" text-anchor="start">430 × 180：继续下降</text><rect x="530" y="460" width="320" height="66" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="550" y="490" fill="#287e59" font-size="23" text-anchor="start">逐层上升</text><path d="M470,493 L524,493" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M310,526 L310,560" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690,560 L690,532" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="565" width="580" height="66" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="230" y="595" fill="#7055a1" font-size="23" text-anchor="start">更多代表层 …… 最低到 7 × 3</text><text x="30" y="686" fill="#24364d" font-size="21" text-anchor="start">每次上升：本层结果 = (1 − β) × 本层下降图 + β × 重建粗层</text><text x="30" y="725" fill="#24364d" font-size="20" text-anchor="start">代表 β = 0.41；每一层都重新引入自身的空间细节。</text><rect x="30" y="770" width="450" height="150" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="800" fill="#2166a8" font-size="23" text-anchor="start">每个轴：四权重配成两组</text><text x="50" y="827" fill="#24364d" font-size="20" text-anchor="start">g₀ = w₀ + w₁</text><text x="50" y="852" fill="#24364d" font-size="20" text-anchor="start">g₁ = w₂ + w₃</text><text x="50" y="877" fill="#24364d" font-size="20" text-anchor="start">组内权重确定线性采样位置</text><rect x="520" y="770" width="450" height="150" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="540" y="800" fill="#287e59" font-size="23" text-anchor="start">二维：2 × 2 = 4 次双线性</text><text x="540" y="827" fill="#24364d" font-size="20" text-anchor="start">组合横纵两轴的位置</text><text x="540" y="852" fill="#24364d" font-size="20" text-anchor="start">按两轴组权重的乘积求和</text><text x="540" y="877" fill="#24364d" font-size="20" text-anchor="start">数学支撑范围仍覆盖四项</text><path d="M480,846 L514,846" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="991" fill="#24364d" font-size="19" text-anchor="start">此处 B-spline 权重非负，目标是平滑放大光晕；原始细层通过混合保留下来。</text><text x="30" y="1070" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text><path d="M470 283 L524 283" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>
