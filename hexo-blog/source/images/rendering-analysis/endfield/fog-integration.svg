<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">终末地 · 一条视线上的散射与透射累积</title><desc id="desc">一个线程顺序处理一列深度；不同横纵位置的列可以并行</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1050" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">终末地 · 一条视线上的散射与透射累积</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">一个线程顺序处理一列深度；不同横纵位置的列可以并行</text><rect x="30" y="110" width="940" height="94" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="140" fill="#2166a8" font-size="23" text-anchor="start">局部体积：每段保存散射源 S 与消光 σ</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">根据投影恢复各层空间位置，用相邻位置距离求 Δs</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">深度层不是等距离切片</text><path d="M500,204 L500,238" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="240" width="280" height="150" rx="12" fill="#f0f3f7" stroke="#526479" stroke-width="1.7"/><text x="50" y="270" fill="#526479" font-size="23" text-anchor="start">初始状态</text><text x="50" y="297" fill="#24364d" font-size="20" text-anchor="start">L = 0</text><text x="50" y="322" fill="#24364d" font-size="20" text-anchor="start">T = 1</text><text x="50" y="347" fill="#24364d" font-size="20" text-anchor="start">尚无散射，完全透射</text><rect x="360" y="240" width="280" height="150" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="380" y="270" fill="#b86518" font-size="23" text-anchor="start">近处一段</text><text x="380" y="297" fill="#24364d" font-size="20" text-anchor="start">t = exp(−σΔs)</text><text x="380" y="322" fill="#24364d" font-size="20" text-anchor="start">新增散射乘旧 T</text><text x="380" y="347" fill="#24364d" font-size="20" text-anchor="start">再更新剩余 T</text><rect x="690" y="240" width="280" height="150" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="710" y="270" fill="#287e59" font-size="23" text-anchor="start">更远一段</text><text x="710" y="297" fill="#24364d" font-size="20" text-anchor="start">读取近段累计 L、T</text><text x="710" y="322" fill="#24364d" font-size="20" text-anchor="start">远处贡献先穿过近段</text><text x="710" y="347" fill="#24364d" font-size="20" text-anchor="start">继续保存累计结果</text><path d="M310,315 L354,315" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640,315 L684,315" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="450" width="940" height="122" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="50" y="480" fill="#7055a1" font-size="23" text-anchor="start">每层都写出“相机到本层”的累计结果</text><text x="50" y="507" fill="#24364d" font-size="20" text-anchor="start">RGB：L，已经加入视线的散射</text><text x="50" y="532" fill="#24364d" font-size="20" text-anchor="start">alpha：T，远处表面颜色还剩多少可以透过</text><path d="M500,572 L500,608" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="610" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="640" fill="#287e59" font-size="23" text-anchor="start">表面按深度查询：输出颜色 = T × 表面颜色 + L</text><text x="50" y="667" fill="#24364d" font-size="20" text-anchor="start">场景与后续角色读取同一累积空气条件</text><text x="50" y="692" fill="#24364d" font-size="20" text-anchor="start">材质着色与空气合成仍承担不同工作</text><text x="30" y="770" fill="#24364d" font-size="21" text-anchor="start">两段相同空气的公式算例：σ = 0.5，Δs = 1，S = 0.5，w = 1</text><rect x="30" y="805" width="450" height="122" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="835" fill="#2166a8" font-size="23" text-anchor="start">经过第一段</text><text x="50" y="862" fill="#24364d" font-size="20" text-anchor="start">散射 L ≈ 0.3935</text><text x="50" y="887" fill="#24364d" font-size="20" text-anchor="start">透射 T ≈ 0.6065</text><rect x="520" y="805" width="450" height="122" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="540" y="835" fill="#287e59" font-size="23" text-anchor="start">经过第二段</text><text x="540" y="862" fill="#24364d" font-size="20" text-anchor="start">散射 L ≈ 0.6321</text><text x="540" y="887" fill="#24364d" font-size="20" text-anchor="start">透射 T ≈ 0.3679</text><path d="M480,865 L514,865" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="993" fill="#24364d" font-size="20" text-anchor="start">第二段只新增约 0.2386：它的散射也会被第一段空气衰减。</text><text x="30" y="1030" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text><path d="M830 390 L830 422 L500 422 L500 444" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>
