<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">终末地 · 空间位置与表面朝向共同决定环境光</title><desc id="desc">相同网格数覆盖不同范围；每层用幅度体积配合方向系数体积</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61748c"/></marker></defs><rect width="1000" height="1000" fill="#fff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><text x="30" y="42" fill="#24364d" font-size="29" text-anchor="start">终末地 · 空间位置与表面朝向共同决定环境光</text><text x="30" y="78" fill="#63738b" font-size="18" text-anchor="start">相同网格数覆盖不同范围；每层用幅度体积配合方向系数体积</text><rect x="30" y="110" width="280" height="122" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="140" fill="#2166a8" font-size="23" text-anchor="start">近层</text><text x="50" y="167" fill="#24364d" font-size="20" text-anchor="start">单格：0.5 世界单位</text><text x="50" y="192" fill="#24364d" font-size="20" text-anchor="start">128 × 64 × 128 位置</text><rect x="360" y="110" width="280" height="122" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="380" y="140" fill="#287e59" font-size="23" text-anchor="start">中层</text><text x="380" y="167" fill="#24364d" font-size="20" text-anchor="start">单格：2 世界单位</text><text x="380" y="192" fill="#24364d" font-size="20" text-anchor="start">边界处从近层接收权重</text><rect x="690" y="110" width="280" height="122" rx="12" fill="#f3eefb" stroke="#7055a1" stroke-width="1.7"/><text x="710" y="140" fill="#7055a1" font-size="23" text-anchor="start">远层</text><text x="710" y="167" fill="#24364d" font-size="20" text-anchor="start">单格：8 世界单位</text><text x="710" y="192" fill="#24364d" font-size="20" text-anchor="start">继续接收更远处影响</text><path d="M310,170 L354,170" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640,170 L684,170" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="295" width="430" height="178" rx="12" fill="#edf5ff" stroke="#2166a8" stroke-width="1.7"/><text x="50" y="325" fill="#2166a8" font-size="23" text-anchor="start">幅度体积</text><text x="50" y="352" fill="#24364d" font-size="20" text-anchor="start">128 × 64 × 128</text><text x="50" y="377" fill="#24364d" font-size="20" text-anchor="start">每个位置保存 RGB 基础幅度</text><text x="50" y="402" fill="#24364d" font-size="20" text-anchor="start">着色位置经过循环坐标映射</text><text x="50" y="427" fill="#24364d" font-size="20" text-anchor="start">取得 Aᵣ、Aɢ、Aᵦ</text><rect x="530" y="295" width="440" height="178" rx="12" fill="#fff4e4" stroke="#b86518" stroke-width="1.7"/><text x="550" y="325" fill="#b86518" font-size="23" text-anchor="start">方向系数体积</text><text x="550" y="352" fill="#24364d" font-size="20" text-anchor="start">128 × 192 × 128</text><text x="550" y="377" fill="#24364d" font-size="20" text-anchor="start">高度三段：红 / 绿 / 蓝</text><text x="550" y="402" fill="#24364d" font-size="20" text-anchor="start">每段保存该颜色的三维方向系数</text><text x="550" y="427" fill="#24364d" font-size="20" text-anchor="start">段内半纹素限制避免跨颜色采样</text><path d="M245 473 L245 515 L500 515 L500 548" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M750 473 L750 515 L500 515" fill="none" stroke="#61748c" stroke-width="2.5"/><rect x="30" y="550" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="580" fill="#287e59" font-size="23" text-anchor="start">对每个颜色恢复：B = A × (4c − 2)</text><text x="50" y="607" fill="#24364d" font-size="20" text-anchor="start">A 是常量幅度，B 是带正负号的方向项</text><text x="50" y="632" fill="#24364d" font-size="20" text-anchor="start">按位置边界权重交接不同层，并结合低频环境项</text><path d="M500,644 L500,678" fill="none" stroke="#61748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="680" width="940" height="94" rx="12" fill="#eaf7f0" stroke="#287e59" stroke-width="1.7"/><text x="50" y="710" fill="#287e59" font-size="23" text-anchor="start">以材质着色方向 N 求值：L = max(A + B · N, 0)</text><text x="50" y="737" fill="#24364d" font-size="20" text-anchor="start">同一空间位置，朝向不同的面可以得到不同环境光</text><text x="50" y="762" fill="#24364d" font-size="20" text-anchor="start">这份低阶方向场不足以单独描述任意尖锐镜面反射</text><text x="30" y="842" fill="#24364d" font-size="23" text-anchor="start">假设 A = 2、B = (0.6, 0, −0.2)：</text><text x="60" y="894" fill="#24364d" font-size="23" text-anchor="start">朝 +x：2.6</text><text x="380" y="894" fill="#24364d" font-size="23" text-anchor="start">朝 −x：1.4</text><text x="700" y="894" fill="#24364d" font-size="23" text-anchor="start">朝 +z：1.8</text><text x="30" y="947" fill="#24364d" font-size="18" text-anchor="start">数值为方向求值算例；并非从某个实际体素额外测得。</text><text x="30" y="980" fill="#758399" font-size="17" text-anchor="start">依据截帧程序重绘的算法示意 · astra</text></g></svg>
